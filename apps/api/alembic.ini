[alembic]
script_location = sentinel_api/migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is set in env.py from MIGRATION_DATABASE_URL / DATABASE_URL.
# It is deliberately absent here so a database URL never lives in a committed file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
